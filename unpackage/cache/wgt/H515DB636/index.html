<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav">
    <div class="nav-title" id="navTitle"></div>
    <button class="nav-btn" id="refreshBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
      </svg>
    </button>
    <button class="menu-btn" id="menuBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </nav>
  <div class="main-container" id="mainContainer">
    <div class="menu" id="menu">
      <div class="menu-list" id="menuList"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
  <script>
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }
    function addTimestamp(url) {
      if (url.includes('?js=')) {
        const separator = url.includes('?t=') ? '&' : '?';
        return url + separator + 't=' + Date.now();
      }
      return url;
    }
    function loadPageData(jsPath) {
      const script = document.createElement('script');
      script.src = jsPath + '?t=' + Date.now();
      script.onload = function() {
        if (typeof pageData !== 'undefined') {
          renderPage(pageData);
        }
      };
      script.onerror = function() {
        const jsName = jsPath.split('/').pop();
        document.getElementById('content').innerHTML = `
          <div style="padding: 40px 20px; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 20px;">😢</div>
            <div style="font-size: 18px; color: #333; margin-bottom: 8px;">页面加载失败</div>
            <div style="font-size: 14px; color: #999; margin-bottom: 25px;">无法找到: ${jsName}</div>
            <div style="display: flex; gap: 12px; justify-content: center;">
              <a href="javascript:history.back()" style="display: inline-block; background: #f5f5f5; color: #333; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-size: 14px;">后退一步</a>
              <a href="./index.html?js=./js/page1.js&t=${Date.now()}" style="display: inline-block; background: #667eea; color: white; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-size: 14px;">返回首页</a>
            </div>
          </div>
        `;
        document.getElementById('navTitle').textContent = '加载失败';
      };
      document.head.appendChild(script);
    }
    function renderPage(data) {
      document.title = data.pageTitle;
      document.getElementById('navTitle').textContent = data.pageTitle;
      const menuList = document.getElementById('menuList');
      menuList.innerHTML = '';
      data.nav.menuList.forEach(item => {
        const menuItem = document.createElement('div');
        menuItem.className = 'menu-item' + (item.isCurrent ? ' current' : '');
        menuItem.textContent = item.text;
        if (item.isCurrent) {
          menuItem.addEventListener('click', function() {
            toggleMenu(false);
          });
        } else {
          menuItem.addEventListener('click', function() {
            toggleMenu(false);
            window.location.href = addTimestamp(item.link);
          });
        }
        menuList.appendChild(menuItem);
      });
      document.getElementById('content').innerHTML = data.content;
      const contentLinks = document.querySelectorAll('#content a[href*="?js="]');
      contentLinks.forEach(function(link) {
        link.href = addTimestamp(link.href);
      });
    }
    let menuOpen = false;
    let ignoreScroll = false;
    const menuBtn = document.getElementById('menuBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const menu = document.getElementById('menu');
    const mainContainer = document.getElementById('mainContainer');
    function toggleMenu(forceState) {
      if (typeof forceState === 'boolean') {
        menuOpen = forceState;
      } else {
        menuOpen = !menuOpen;
      }
      if (menuOpen) {
        ignoreScroll = true;
        mainContainer.scrollTop = 0;
        setTimeout(() => {
          ignoreScroll = false;
        }, 100);
      }
      if (menuOpen) {
        menu.classList.add('open');
        mainContainer.classList.add('menu-open');
      } else {
        menu.classList.remove('open');
        mainContainer.classList.remove('menu-open');
      }
    }
    refreshBtn.addEventListener('click', function() {
      const jsPath = getQueryParam('js') || './js/page1.js';
      const timestamp = Date.now();
      const baseUrl = window.location.origin + window.location.pathname;
      window.location.href = baseUrl + '?js=' + encodeURIComponent(jsPath) + '&t=' + timestamp;
    });
    menuBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleMenu();
    });
    document.addEventListener('click', function(e) {
      if (menuOpen && !menu.contains(e.target) && e.target !== menuBtn && e.target !== refreshBtn) {
        toggleMenu(false);
      }
    });
    mainContainer.addEventListener('scroll', function() {
      if (ignoreScroll) return;
      if (menuOpen) {
        toggleMenu(false);
      }
    });
    const jsPath = getQueryParam('js') || './js/page1.js';
    loadPageData(jsPath);
  </script>
</body>
</html>
